<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>公式编辑</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#1a2332;color:#1a1a1a;min-height:100vh}
  .app{max-width:1280px;margin:0 auto;min-height:800px;background:#f4f6f9;display:flex;flex-direction:column}
  .top{height:56px;background:#0f2744;color:#fff;display:flex;align-items:center;padding:0 20px;gap:16px}
  .top .brand{font-weight:700;font-size:16px;letter-spacing:.02em}
  .top .nav{display:flex;gap:8px;margin-left:24px}
  .top .nav span{padding:6px 12px;border-radius:6px;font-size:13px;opacity:.75}
  .top .nav span.on{background:#2b6cb0;opacity:1}
  .top .right{margin-left:auto;display:flex;gap:10px;align-items:center;font-size:13px}
  .btn{border:none;border-radius:8px;padding:8px 14px;font-size:13px;cursor:default;font-weight:600}
  .btn-primary{background:#2b6cb0;color:#fff}
  .btn-ghost{background:rgba(255,255,255,.12);color:#fff}
  .btn-light{background:#fff;color:#0f2744;border:1px solid #d0d7e2}
  .btn-warn{background:#dd6b20;color:#fff}
  .btn-ok{background:#2f855a;color:#fff}
  .main{flex:1;padding:20px;display:flex;gap:16px}
  .card{background:#fff;border-radius:12px;border:1px solid #e2e8f0;box-shadow:0 1px 2px rgba(15,39,68,.06)}
  .label{font-size:12px;color:#64748b;margin-bottom:6px}
  .title{font-size:18px;font-weight:700;color:#0f2744}
  .mute{color:#64748b;font-size:13px}
  .chip{display:inline-block;padding:2px 8px;border-radius:999px;background:#ebf4ff;color:#2b6cb0;font-size:12px;font-weight:600}
  .chip-green{background:#f0fff4;color:#2f855a}
  .chip-orange{background:#fffaf0;color:#c05621}
  .wire-tag{position:fixed;top:8px;right:8px;z-index:99;background:#dd6b20;color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;font-weight:700}
</style>
</head>
<body>
<div class="wire-tag">原型线框 · 非工程</div>

<div class="app">
  <div class="top">
    <div class="brand">公式编辑 · 例题1 · 步骤2</div>
    <div class="right"><button class="btn btn-ghost">取消</button><button class="btn btn-primary">完成</button></div>
  </div>
  <div class="main">
    <div style="width:280px;display:flex;flex-direction:column;gap:12px">
      <div class="card" style="padding:14px">
        <div class="label">常用模板（点一下插入）</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <button class="btn btn-light" style="font-size:16px">a/b</button>
          <button class="btn btn-light" style="font-size:16px">x²</button>
          <button class="btn btn-light" style="font-size:16px">√x</button>
          <button class="btn btn-light" style="font-size:16px">f′(x)</button>
          <button class="btn btn-light" style="font-size:16px">lim</button>
          <button class="btn btn-light" style="font-size:16px">Δy/Δx</button>
        </div>
      </div>
      <div class="card" style="padding:14px">
        <div class="label">符号键（像计算器）</div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px">
          <button class="btn btn-light">+</button><button class="btn btn-light">−</button>
          <button class="btn btn-light">×</button><button class="btn btn-light">÷</button>
          <button class="btn btn-light">(</button><button class="btn btn-light">)</button>
          <button class="btn btn-light">=</button><button class="btn btn-light">x</button>
          <button class="btn btn-light">h</button><button class="btn btn-light">1</button>
          <button class="btn btn-light">2</button><button class="btn btn-light">⌫</button>
        </div>
      </div>
    </div>
    <div class="card" style="flex:1;padding:20px;display:flex;flex-direction:column">
      <div class="label">公式编辑区（点哪里改哪里 · 不出现专业排版术语）</div>
      <div style="margin-top:10px;flex:1;border:2px solid #2b6cb0;border-radius:12px;background:#fff;padding:24px;display:flex;align-items:center;justify-content:center">
        <div style="font-size:42px;font-weight:600;color:#0f2744;letter-spacing:.04em">
          <span style="border-bottom:3px solid #2b6cb0;padding:0 4px">f(1+h)</span>
          <span> − f(1)</span>
          <span style="display:inline-block;border-top:2px solid #0f2744;margin:0 8px;padding:0 8px">h</span>
        </div>
      </div>
      <div class="mute" style="margin-top:12px">提示：先点模板，再在编辑区点选要改的部分；也可用左侧符号键。</div>
      <div style="margin-top:16px;padding:12px;background:#f0fff4;border-radius:8px;border:1px solid #c6f6d5;font-size:13px;color:#276749">
        预览（投影里会更大）： [f(1+h) − f(1)] / h
      </div>
    </div>
  </div>
</div>
</body>
</html>
