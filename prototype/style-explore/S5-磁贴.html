<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>S5 磁贴活力 · 阿乐老师的数学课堂</title>
<style>

:root {
  --bg: #eef2ff;
  --paper: #ffffff;
  --ink: #1e1b4b;
  --muted: #6366a0;
  --accent: #7c3aed;
  --accent2: #f97316;
  --teal: #14b8a6;
  --pink: #ec4899;
  --line: #ddd6fe;
  --shadow: rgba(124, 58, 237, .12);
  --mask: rgba(30, 27, 75, .35);
  --scratch-bg: #ffffff;
  --dock-bg: #ffffff;
  --formula: #7c3aed;
  --sans: "Noto Sans CJK SC", "Noto Sans", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:800px;overflow:hidden;background:#d8dff8}
body{font-family:var(--sans);color:var(--ink)}
.badge{position:fixed;top:64px;right:352px;z-index:50;background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px}
.frame{width:1280px;height:800px;background:linear-gradient(145deg,#eef2ff 0%,#fce7f3 45%,#e0f2fe 100%);position:relative}
.topbar{height:60px;display:flex;align-items:center;padding:0 22px;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);border-bottom:2px solid transparent;border-image:linear-gradient(90deg,#7c3aed,#14b8a6,#f97316) 1}
.brand{display:flex;align-items:baseline;gap:8px}
.app-name{font-size:17px;font-weight:800;background:linear-gradient(90deg,#7c3aed,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sep{color:var(--muted)}
.mode{font-size:13px;color:var(--muted);font-weight:600}
.top-actions{margin-left:auto;display:flex;gap:8px}
.chip{border:none;background:#ede9fe;color:var(--accent);padding:7px 14px;border-radius:999px;font-size:12px;font-weight:700;font-family:inherit}
.chip.danger{background:#ffedd5;color:#c2410c}
.stage-wrap{position:relative;height:740px;overflow:hidden}
.mask{position:absolute;inset:0 340px 0 0;background:var(--mask);z-index:5;pointer-events:none}
.stage{position:absolute;inset:0;padding:22px 360px 22px 24px;display:flex;flex-direction:column;gap:14px}
.canvas{flex:1;position:relative}
.block{position:absolute;background:var(--paper);border:none;border-radius:20px;
  box-shadow:0 10px 30px var(--shadow), 0 2px 0 rgba(255,255,255,.8) inset;padding:18px 20px}
.b1{left:10px;top:6px;width:500px;transform:rotate(-1deg);background:linear-gradient(135deg,#fff 60%,#f5f3ff)}
.b1::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:20px 20px 0 0;background:linear-gradient(90deg,#7c3aed,#a78bfa)}
.b2{left:60px;top:160px;width:460px;transform:rotate(1.3deg);background:linear-gradient(135deg,#fff 50%,#fff7ed)}
.b2::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:20px 20px 0 0;background:linear-gradient(90deg,#f97316,#fb923c)}
.b3{left:390px;top:355px;width:300px;transform:rotate(-1.6deg);background:linear-gradient(135deg,#fff 50%,#f0fdfa)}
.b3::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;border-radius:20px 20px 0 0;background:linear-gradient(90deg,#14b8a6,#2dd4bf)}
.b-label{font-size:11px;font-weight:800;margin-bottom:8px;letter-spacing:.08em;text-transform:uppercase}
.b1 .b-label{color:#7c3aed}.b2 .b-label{color:#ea580c}.b3 .b-label{color:#0d9488}
.b-title{font-size:20px;line-height:1.45;font-weight:700;color:var(--ink)}
.formula{font-size:25px;font-weight:800;color:var(--formula)}
.hint{margin-top:8px;font-size:12px;color:var(--muted);font-weight:500}
.b-body{font-size:14px;line-height:1.7;color:#4338ca}
.dock{position:relative;z-index:20;display:flex;align-items:center;gap:10px;padding:12px 14px;background:rgba(255,255,255,.9);border-radius:20px;box-shadow:0 8px 24px var(--shadow)}
.dock-btn{border:none;background:#ede9fe;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:800;font-family:inherit;color:var(--accent)}
.dock-btn.primary{background:linear-gradient(135deg,#7c3aed,#a78bfa);color:#fff;box-shadow:0 4px 14px rgba(124,58,237,.35)}
.dock-btn.accent{background:linear-gradient(135deg,#f97316,#fb923c);color:#fff}
.dock-meta{margin-left:auto;font-size:12px;color:var(--muted);font-weight:600}
.scratch{position:absolute;top:0;right:0;width:340px;height:100%;z-index:10;background:var(--scratch-bg);
  border-left:none;box-shadow:-16px 0 40px rgba(124,58,237,.15);display:flex;flex-direction:column;padding:16px;
  border-radius:24px 0 0 24px}
.scratch-head{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.scratch-head strong{font-size:16px;font-weight:800;color:var(--accent)}
.scratch-sub{font-size:11px;color:var(--muted);font-weight:600}
.scratch-close{margin-left:auto;border:none;background:#fce7f3;width:28px;height:28px;border-radius:50%;font-size:16px;color:#be185d;line-height:28px;text-align:center;padding:0}
.scratch-tools{display:flex;gap:6px;align-items:center;margin-bottom:12px}
.tool{font-size:11px;padding:5px 10px;border-radius:999px;border:none;background:#f3e8ff;color:var(--accent);font-weight:700}
.tool.on{background:var(--accent);color:#fff}
.swatch{width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatch.s1{background:#1e1b4b}.swatch.s2{background:#7c3aed}.swatch.s3{background:#f97316}
.scratch-pad{flex:1;border:2px dashed #ddd6fe;border-radius:18px;background:linear-gradient(180deg,#faf5ff,#fff);padding:12px;color:#6d28d9}
.doodle{width:100%;height:140px;display:block}
.calc-line{margin-top:8px;font-size:14px;font-weight:800;color:var(--ink);padding:10px 12px;background:#fff;border-radius:12px;box-shadow:0 2px 8px var(--shadow)}
.ai-panel{position:absolute;left:24px;bottom:90px;z-index:25;width:260px;background:#fff;border:none;border-radius:18px;padding:14px;box-shadow:0 12px 32px var(--shadow)}
.ai-panel::before{content:"";display:block;height:4px;border-radius:4px;background:linear-gradient(90deg,#7c3aed,#14b8a6,#f97316);margin:-14px -14px 12px;border-radius:18px 18px 0 0}
.ai-title{font-size:13px;font-weight:800;color:var(--accent);margin-bottom:10px}
.ai-row{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:8px;font-weight:600}
.ai-row.muted{color:var(--muted);font-weight:500}
.svc{font-weight:700;color:var(--accent2);font-size:11px}
.ai-note{font-size:10px;color:var(--muted);margin-top:4px;line-height:1.4}
.toggle{position:relative;width:42px;height:24px;display:inline-block}
.toggle input{opacity:0;width:0;height:0}
.knob{position:absolute;inset:0;background:linear-gradient(135deg,#7c3aed,#a78bfa);border-radius:999px}
.knob:before{content:"";position:absolute;width:18px;height:18px;left:21px;top:3px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.15)}

</style>
</head>
<body>

<div class="badge">风格探索原型 · 非工程</div>
<div class="frame">
  <header class="topbar">
    <div class="brand">
      <span class="app-name">阿乐老师的数学课堂</span>
      <span class="sep">·</span>
      <span class="mode">投影讲题 · 第1节 导数的概念</span>
    </div>
    <div class="top-actions">
      <button class="chip">草稿</button>
      <button class="chip">批注</button>
      <button class="chip danger">退出投影</button>
    </div>
  </header>

  <div class="stage-wrap">
    <!-- dim mask over canvas when draft open -->
    <div class="mask"></div>

    <main class="stage">
      <div class="canvas">
        <!-- draggable-looking blocks, staggered -->
        <div class="block b1">
          <div class="b-label">例题 1 / 2</div>
          <div class="b-title">已知 f(x)=x²，求从 x=1 到 x=1+h 的平均变化率。</div>
        </div>
        <div class="block b2">
          <div class="b-label">当前步骤 2 / 3</div>
          <div class="formula">= [f(1+h) − f(1)] / h</div>
          <div class="hint">上一步已淡出 · 本步高亮</div>
        </div>
        <div class="block b3">
          <div class="b-label">要点卡片</div>
          <div class="b-body">平均变化率表示函数在某一段上的「平均快慢」。先平均，再过渡到瞬时（导数）。</div>
        </div>
      </div>

      <div class="dock">
        <button class="dock-btn">上一步</button>
        <button class="dock-btn primary">下一步</button>
        <button class="dock-btn">跳过动画</button>
        <button class="dock-btn accent">显隐答案</button>
        <span class="dock-meta">答案：隐藏中</span>
      </div>
    </main>

    <!-- draft sidebar -->
    <aside class="scratch">
      <div class="scratch-head">
        <strong>草稿本</strong>
        <span class="scratch-sub">上课演算 · 不写入例题</span>
        <button class="scratch-close">×</button>
      </div>
      <div class="scratch-tools">
        <span class="tool on">笔</span>
        <span class="tool">橡皮</span>
        <span class="tool">清空</span>
        <span class="swatch s1"></span>
        <span class="swatch s2"></span>
        <span class="swatch s3"></span>
      </div>
      <div class="scratch-pad">
        <svg class="doodle" viewBox="0 0 280 160" xmlns="http://www.w3.org/2000/svg">
          <path d="M20 40 Q60 10 100 50 T180 40" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" opacity=".85"/>
          <path d="M40 90 L120 70 L200 110" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".7"/>
          <circle cx="210" cy="55" r="28" fill="none" stroke="currentColor" stroke-width="2" opacity=".65"/>
          <path d="M30 130 Q90 150 160 120" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="4 3" opacity=".5"/>
        </svg>
        <div class="calc-line">演算： (1+h)² − 1 = 2h + h²</div>
      </div>
    </aside>
  </div>

  <!-- AI settings float -->
  <div class="ai-panel">
    <div class="ai-title">AI 释义设置</div>
    <div class="ai-row">
      <span>开启 AI 释义</span>
      <label class="toggle"><input type="checkbox" checked disabled/><span class="knob"></span></label>
    </div>
    <div class="ai-row muted">
      <span>服务商</span>
      <span class="svc">DeepSeek（可选联网）</span>
    </div>
    <div class="ai-note">离线底可用 · 释义需联网时再开</div>
  </div>
</div>

</body>
</html>
